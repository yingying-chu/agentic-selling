# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "09da9d7fd8d368b59c57d15b0da9107e"
name = "Sellie"
application_url = "https://sellie-dusky.vercel.app"
embedded = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_products,write_products,read_inventory,write_inventory,read_locations,read_orders,write_publications"

[webhooks]
api_version = "2027-01"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/orders/create"
  topics = [ "orders/create" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/compliance"
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

[product.metafields.app.floor_net]
name = "Take-home floor"
description = "Least the seller wants to keep after fees and shipping (USD)"
type = "number_decimal"

  [product.metafields.app.floor_net.access]
  admin = "merchant_read_write"

[product.metafields.app.facts]
name = "Item details"
description = "Brand, size, condition, flaws and more, used to write listings"
type = "json"

  [product.metafields.app.facts.access]
  admin = "merchant_read"

[product.metafields.app.listings]
name = "Marketplace listings"
description = "Listing text and price for each marketplace"
type = "json"

  [product.metafields.app.listings.access]
  admin = "merchant_read"

[product.metafields.app.channels]
name = "Marketplace status"
description = "Where the item is posted, sold, or needs to be taken down"
type = "json"

  [product.metafields.app.channels.access]
  admin = "merchant_read"

[product.metafields.app.photo_kinds]
name = "Photo types"
description = "Which photos are originals, corrected, studio, or AI-generated"
type = "json"

  [product.metafields.app.photo_kinds.access]
  admin = "merchant_read"

[product.metafields.app.notes]
name = "Seller notes"
description = "What the seller said when adding the item, kept after the description becomes the store listing"
type = "multi_line_text_field"

  [product.metafields.app.notes.access]
  admin = "merchant_read"

[product.metafields.app.ai_trace]
name = "AI calls"
description = "Which AI model handled each step, on which provider, how fast and at what cost"
type = "json"

  [product.metafields.app.ai_trace.access]
  admin = "merchant_read"

[auth]
redirect_urls = [ "https://sellie-dusky.vercel.app/auth/callback", "https://sellie-dusky.vercel.app/auth/shopify/callback", "https://sellie-dusky.vercel.app/api/auth/callback" ]

[build]
automatically_update_urls_on_dev = true
